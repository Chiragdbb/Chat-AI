name: Keep Render awake

on:
  schedule:
    # ~every 12 minutes (Render free tier sleeps after ~15 min idle)
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL secret is not set"
            exit 1
          fi
          curl -fsS --max-time 30 "$RENDER_HEALTH_URL"
